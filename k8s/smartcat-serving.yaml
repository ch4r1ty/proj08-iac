apiVersion: v1
kind: Namespace
metadata:
  name: smartcat
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartcat-serving
  namespace: smartcat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartcat-serving
  template:
    metadata:
      labels:
        app: smartcat-serving
    spec:
      containers:
        - name: serve
          image: registry.kube-system.svc.cluster.local:5000/actualbudget-serving:latest
          # Always pull the demo image so serving updates are not hidden by node caches.
          imagePullPolicy: Always
          command: ["python", "-m", "app.launch"]
          ports:
            - containerPort: 8000
          env:
            - name: BACKEND_KIND
              value: "onnx_dynamic_quant"
            - name: MODEL_PATH
              value: "/workspace/models/optimized/v2_tfidf_linearsvc_model.dynamic_quant.onnx"
            - name: SOURCE_MODEL_PATH
              value: "/workspace/models/source/v2_tfidf_linearsvc_model.joblib"
            - name: MODEL_VERSION
              value: "v2_tfidf_linearsvc"
            - name: CODE_VERSION
              value: "k8s"
            - name: SERVICE_HOST
              value: "0.0.0.0"
            - name: SERVICE_PORT
              value: "8000"
            - name: WEB_CONCURRENCY
              value: "1"
            - name: RUNTIME_DIR
              value: "/workspace/runtime"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: smartcat-serving
  namespace: smartcat
  labels:
    app: smartcat-serving
spec:
  type: NodePort
  selector:
    app: smartcat-serving
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30090
