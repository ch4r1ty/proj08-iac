{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: proj08-route
  namespace: gourmetgram-platform
spec:
  parentRefs:
  - name: proj08-gateway
  rules:
  - backendRefs:
    - name: actual-budget
      namespace: actual-budget-production
      port: 8080
      weight: 90
    - name: actual-budget
      namespace: actual-budget-canary
      port: 8081
      weight: 10
{{- end }}
