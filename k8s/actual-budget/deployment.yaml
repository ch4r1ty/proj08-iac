apiVersion: v1
kind: Namespace
metadata:
  name: actual-budget
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: actual-budget
  namespace: actual-budget
spec:
  replicas: 1
  selector:
    matchLabels:
      app: actual-budget
  template:
    metadata:
      labels:
        app: actual-budget
    spec:
      securityContext:
        fsGroup: 1001
      containers:
        - name: actual-budget
          image: registry.kube-system.svc.cluster.local:5000/actual-sync:latest
          # Always pull the demo image so rebuilding :latest actually refreshes pods.
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5006
          env:
            - name: ACTUAL_PORT
              value: "5006"
            - name: ACTUAL_HOSTNAME
              value: "0.0.0.0"
            - name: ACTUAL_DATA_DIR
              value: "/data"
            - name: ACTUAL_ML_SERVICE_URL
              value: "http://smartcat-serving.smartcat.svc.cluster.local:8000"
            - name: ACTUAL_ML_SERVICE_TIMEOUT_MS
              value: "2500"
          volumeMounts:
            - name: actual-budget-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 5006
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5006
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: actual-budget-data
          # emptyDir keeps the demo reproducible on fresh Chameleon clusters even
          # when a dynamic StorageClass is not installed. Use a PVC for durable data.
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: actual-budget
  namespace: actual-budget
spec:
  # Internal clients use actual-budget.actual-budget.svc.cluster.local:8083.
  # The same service also exposes HTTP fallback on NodePort 30083 for debugging.
  type: NodePort
  selector:
    app: actual-budget
  ports:
    - name: http
      port: 8083
      targetPort: 5006
      nodePort: 30083
